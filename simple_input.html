<!-- Mode Toggle Header -->
<div class="input-mode-header">
  <span class="panel-label">INPUT EXPRESSION</span>
  <div class="mode-switch" role="group" aria-label="Input Mode">
    <button type="button" id="btn-mode-simple" class="mode-btn active">Simple</button>
    <button type="button" id="btn-mode-advanced" class="mode-btn">Advanced</button>
  </div>
</div>

<!-- SIMPLE MODE: Guided Mixed-Type Builder -->
<div id="simple-input-panel" class="simple-builder">
  <!-- Row 1: Unary Prefix for Operand A -->
  <div class="builder-row">
    <span class="row-hint">Prefix:</span>
    <button type="button" class="op-pill unary-btn" data-target="a" data-op="">None</button>
    <button type="button" class="op-pill unary-btn" data-target="a" data-op="~">~ (1's Comp)</button>
    <button type="button" class="op-pill unary-btn" data-target="a" data-op="!">! (2's Comp)</button>
  </div>

  <!-- Row 2: Operand A + Type Dropdown -->
  <div class="builder-row input-group">
    <input type="text" id="simple-op-a" class="dark-input" placeholder="Operand A (e.g. FF00)" value="3.14">
    <select id="simple-type-a" class="dark-select">
      <option value="REAL" selected>REAL</option>
      <option value="HEX">HEX</option>
      <option value="BIN">BIN</option>
      <option value="FP32">FP32</option>
      <option value="FP64">FP64</option>
    </select>
  </div>

  <!-- Row 3: Binary Operator Buttons -->
  <div class="builder-row operator-grid">
    <button type="button" class="op-pill bin-op active" data-op="+">+</button>
    <button type="button" class="op-pill bin-op" data-op="-">-</button>
    <button type="button" class="op-pill bin-op" data-op="*">*</button>
    <button type="button" class="op-pill bin-op" data-op="/">/</button>
    <button type="button" class="op-pill bin-op" data-op="%">%</button>
    <button type="button" class="op-pill bin-op" data-op="&">&amp;</button>
    <button type="button" class="op-pill bin-op" data-op="|">|</button>
    <button type="button" class="op-pill bin-op" data-op="^">^</button>
  </div>

  <!-- Row 4: Optional Unary Prefix for Operand B -->
  <div class="builder-row">
    <span class="row-hint">Prefix B:</span>
    <button type="button" class="op-pill unary-btn active" data-target="b" data-op="">None</button>
    <button type="button" class="op-pill unary-btn" data-target="b" data-op="~">~</button>
    <button type="button" class="op-pill unary-btn" data-target="b" data-op="!">!</button>
  </div>

  <!-- Row 5: Operand B + Type Dropdown -->
  <div class="builder-row input-group">
    <input type="text" id="simple-op-b" class="dark-input" placeholder="Operand B (optional)" value="101.11">
    <select id="simple-type-b" class="dark-select">
      <option value="REAL">REAL</option>
      <option value="HEX">HEX</option>
      <option value="BIN" selected>BIN</option>
      <option value="FP32">FP32</option>
      <option value="FP64">FP64</option>
    </select>
  </div>
</div>

<!-- ADVANCED MODE: Your Existing Single-Line Expression Box -->
<div id="advanced-input-panel" class="advanced-builder hidden">
  <input type="text" id="main-expression-input" class="dark-input" placeholder="e.g. (101.11 * 010.01) + ~001.10">
</div>
