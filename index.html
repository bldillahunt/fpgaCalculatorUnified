<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://googletagmanager.com"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        if (window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1' && window.location.protocol !== 'file:') {
            gtag('config', 'G-YWXKTWJWB2');
        }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FPGA Math Emulator & IEEE-754 Converter</title>
    <meta name="description" content="Arbitrary-precision calculator for FPGA engineers. Supports IEEE 754 floating-point, signed two's complement binary, and custom fixed-point binary math.">
    <meta name="author" content="bldillahunt">
    <link rel="canonical" href="https://github.io">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header class="header-bar">
        <div class="header-title-group">
            <h1>FPGA Math Emulator &amp; IEEE-754 Converter</h1>
            <p class="header-subtitle">Deterministic bit-level hardware math, Q-format fixed-point &amp; zero-builtin IEEE-754 encoding</p>
        </div>
        <button type="button" id="btn_help" class="help-icon-btn" title="Syntax &amp; Documentation">? Guide</button>
    </header>

    <main class="workspace-grid">
        <section class="panel-card">

            <label class="field-label" for="input_box">Input Expression <span class="hint-inline">(spaces &amp; 0x/0b stripped)</span></label>
            <input type="text" id="input_box" value="" placeholder="e.g., 3.14 or 101.11 * 010.01" autocomplete="off" autocapitalize="off" spellcheck="false">

            <div class="primary-output-box">
                <div class="primary-output-header">
                    <span id="primary_output_label">SELECTED OUTPUT (FP32)</span>
                    <button type="button" class="mini-btn" id="copy_primary_btn">Copy</button>
                </div>
                <div id="output_box" class="primary-output-value"></div>
            </div>

            <label class="field-label">Input Format</label>
            <div class="radio-group" id="input_mode_container">
                <label><input type="radio" name="input_mode" value="REAL" checked> REAL</label>
                <label><input type="radio" name="input_mode" value="HEX"> HEX</label>
                <label><input type="radio" name="input_mode" value="BIN"> BIN</label>
                <label><input type="radio" name="input_mode" value="FP32"> FP32 (Hex)</label>
                <label><input type="radio" name="input_mode" value="FP64"> FP64 (Hex)</label>
            </div>

            <label class="field-label">Primary Output Format</label>
            <div class="radio-group" id="output_mode_container">
                <label><input type="radio" name="output_mode" value="REAL"> REAL</label>
                <label><input type="radio" name="output_mode" value="HEX"> HEX</label>
                <label><input type="radio" name="output_mode" value="BIN"> BIN</label>
                <label><input type="radio" name="output_mode" value="FP32" checked> FP32 (Hex)</label>
                <label><input type="radio" name="output_mode" value="FP64"> FP64 (Hex)</label>
            </div>

            <div class="bits-row">
                <div class="bits-col">
                    <label class="field-label" for="int_bits_box">Integer Bits</label>
                    <input type="number" id="int_bits_box" value="16" min="1">
                </div>
                <div class="bits-col">
                    <label class="field-label" for="frac_bits_box">Fraction Bits</label>
                    <input type="number" id="frac_bits_box" value="16" min="0">
                </div>
                <div class="bits-col">
                    <label class="field-label">Q-Format</label>
                    <div id="q_output_format" class="q-badge">Q16.16</div>
                </div>
            </div>

            <div id="pc_buttons_container" class="pc-buttons-row">
                <button type="button" data-key="Reset" class="reset-btn">Reset</button>
                <button type="button" data-key="Enter" class="action-btn">Calculate (Enter)</button>
            </div>

            <div id="keypad_container" class="keypad-grid" style="display: none;"></div>

            <div class="controls-bar">
                <label class="checkbox-label"><input type="checkbox" id="use_keypad"> Show On-Screen Keypad</label>
            </div>
        </section>

        <section class="panel-card">
            <div class="section-header"><h2>Hardware Output Inspector</h2></div>

            <div id="all_formats_list" class="all-formats-list"></div>
        </section>
    </main>

    <div id="help_modal" class="help-modal-overlay"></div>

    <script type="module" src="calculator_top.js"></script>
    <script type="module" src="ui.js"></script>
</body>
</html>
